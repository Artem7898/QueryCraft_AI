version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: querycraft-ai:latest
    container_name: querycraft-ai-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      - querycraft-network

  nginx-proxy:
    image: nginx:alpine
    container_name: querycraft-ai-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
    depends_on:
      - web
    networks:
      - querycraft-network

networks:
  querycraft-network:
    driver: bridge