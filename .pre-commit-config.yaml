repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.js$
        pass_filenames: false
